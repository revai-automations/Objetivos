<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Objetivos">
<meta name="theme-color" content="#0B0E14">
<title>Objetivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E14;
    --surface:#141922;
    --surface-2:#1B2230;
    --surface-3:#232B3B;
    --line:#262E3D;
    --indigo:#6366F1;
    --indigo-dim:#4F46E5;
    --cyan:#22D3EE;
    --text:#E7E9EE;
    --muted:#8B93A6;
    --danger:#F87171;
    --done:#34D399;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:64px;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 18px 40px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .mark{
    width:30px;height:30px;
    border-radius:9px;
    background:conic-gradient(from 220deg, var(--indigo), var(--cyan), var(--indigo));
    position:relative;flex:none;
  }
  .mark::after{content:'';position:absolute;inset:5px;background:var(--bg);border-radius:6px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:0;letter-spacing:-0.02em;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .icon-btn{
    flex:none;width:34px;height:34px;border-radius:10px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--muted);display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:15px;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--indigo);}
  .icon-btn.active{color:var(--cyan);border-color:var(--cyan);}

  .add-box{display:flex;gap:8px;margin-bottom:16px;}
  .add-box input{
    flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);
    padding:13px 14px;border-radius:12px;font-size:15px;font-family:'Inter',sans-serif;
  }
  .add-box input::placeholder{color:var(--muted);}
  .add-box input:focus{outline:none;border-color:var(--indigo);}
  .add-box button{
    background:var(--indigo-dim);border:none;color:white;padding:0 18px;border-radius:12px;
    font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;
  }
  .add-box button:active{transform:scale(0.97);}

  /* Importance panel */
  .imp-panel{
    display:none;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:16px;
  }
  .imp-panel.show{display:block;}
  .imp-panel-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:10px;}
  .imp-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
  .imp-dot{width:12px;height:12px;border-radius:50%;flex:none;}
  .imp-name{flex:1;font-size:14px;}
  .imp-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;}
  .imp-del:hover{color:var(--danger);}
  .imp-add{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .imp-add input[type="text"]{
    flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:8px 10px;border-radius:9px;font-size:13.5px;font-family:'Inter',sans-serif;
  }
  .imp-add input[type="text"]:focus{outline:none;border-color:var(--indigo);}
  .color-swatches{display:flex;gap:6px;flex-wrap:wrap;}
  .swatch{
    width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;
    flex:none;
  }
  .swatch.selected{border-color:var(--text);}
  .imp-add button{
    background:var(--surface-3);border:1px solid var(--line);color:var(--cyan);
    padding:8px 12px;border-radius:9px;font-size:13px;cursor:pointer;flex:none;
  }

  .filters{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
  .chip{
    font-size:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);background:transparent;cursor:pointer;white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .chip.active{background:var(--surface-2);color:var(--text);border-color:var(--indigo);}

  .order-hint{
    font-size:11.5px;color:var(--muted);margin-bottom:14px;
    display:flex;align-items:center;gap:6px;
  }

  .goal{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    margin-bottom:12px;overflow:hidden;border-left:3px solid var(--goal-color, var(--indigo));
  }
  .goal-head{display:flex;align-items:center;gap:10px;padding:14px 14px;cursor:pointer;}
  .reorder-col{display:flex;flex-direction:column;gap:2px;flex:none;}
  .reorder-btn{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;
    line-height:1;padding:2px 3px;
  }
  .reorder-btn:hover{color:var(--text);}
  .reorder-btn:disabled{opacity:0.25;cursor:default;}
  .reorder-btn:disabled:hover{color:var(--muted);}

  .ring{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;}
  .ring svg{transform:rotate(-90deg);}
  .ring-bg{stroke:var(--surface-2);}
  .ring-fg{stroke:var(--goal-color, var(--indigo));transition:stroke-dashoffset .3s ease;}
  .goal-title-wrap{flex:1;min-width:0;}
  .goal-title{font-family:'Space Grotesk',sans-serif;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .goal-title.done{color:var(--muted);text-decoration:line-through;}
  .goal-meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .imp-badge{
    font-size:10.5px;padding:2px 7px;border-radius:999px;font-weight:600;
    display:inline-flex;align-items:center;gap:4px;
  }
  .status-select{
    flex:none;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    font-size:11.5px;font-family:'Inter',sans-serif;padding:6px 8px;border-radius:9px;
    -webkit-appearance:none;appearance:none;
  }
  .status-select.pendiente{color:var(--muted);}
  .status-select.en-progreso{color:var(--cyan);border-color:rgba(34,211,238,0.3);}
  .status-select.completado{color:var(--done);border-color:rgba(52,211,153,0.3);}

  .chevron{flex:none;color:var(--muted);transition:transform .2s ease;font-size:12px;}
  .goal.open .chevron{transform:rotate(90deg);}

  .goal-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line);}
  .goal.open .goal-body{display:block;}

  .section-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:14px 0 8px;font-weight:600;display:flex;align-items:center;justify-content:space-between;
  }
  .link-btn{background:none;border:none;color:var(--cyan);font-size:11.5px;cursor:pointer;font-family:'Inter',sans-serif;}
  .link-btn:hover{text-decoration:underline;}

  /* Edit form */
  .edit-form{
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0 4px;
  }
  .edit-field{margin-bottom:10px;}
  .edit-field label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;}
  .edit-field input[type="text"]{
    width:100%;background:var(--surface-3);border:1px solid var(--line);color:var(--text);
    padding:9px 10px;border-radius:9px;font-size:14px;font-family:'Inter',sans-serif;
  }
  .edit-field input[type="text"]:focus{outline:none;border-color:var(--indigo);}
  .edit-field select{
    width:100%;background:var(--surface-3);border:1px solid var(--line);color:var(--text);
    padding:9px 10px;border-radius:9px;font-size:14px;font-family:'Inter',sans-serif;
  }
  .edit-actions{display:flex;gap:8px;margin-top:12px;}
  .btn-save{background:var(--indigo-dim);border:none;color:white;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn-cancel{background:none;border:1px solid var(--line);color:var(--muted);padding:9px 16px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:'Inter',sans-serif;}

  .subtask{
    display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);
  }
  .subtask:last-of-type{border-bottom:none;}
  .sub-reorder{display:flex;flex-direction:column;gap:1px;flex:none;}
  .sub-reorder .reorder-btn{font-size:9px;padding:1px 2px;}
  .subtask-check{
    flex:none;width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;
  }
  .subtask-check.checked{background:var(--indigo-dim);border-color:var(--indigo-dim);color:white;}
  .subtask-text{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .subtask-text.checked{color:var(--muted);text-decoration:line-through;}
  .sub-note-toggle{
    flex:none;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px;
  }
  .sub-note-toggle.has-note{color:var(--cyan);}
  .del-btn{flex:none;color:var(--muted);background:none;border:none;font-size:16px;cursor:pointer;padding:2px 4px;}
  .del-btn:hover{color:var(--danger);}
  .subtask-notes{
    padding:6px 0 10px 27px;
  }
  .subtask-notes textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;resize:vertical;min-height:48px;
  }
  .subtask-notes textarea:focus{outline:none;border-color:var(--indigo);}

  .add-sub{display:flex;gap:8px;margin-top:8px;}
  .add-sub input{
    flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:9px 11px;border-radius:9px;font-size:13.5px;font-family:'Inter',sans-serif;
  }
  .add-sub input:focus{outline:none;border-color:var(--indigo);}
  .add-sub button{background:var(--surface-2);border:1px solid var(--line);color:var(--cyan);padding:0 14px;border-radius:9px;font-size:13px;cursor:pointer;}

  textarea.notes{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:'Inter',sans-serif;resize:vertical;min-height:64px;
  }
  textarea.notes:focus{outline:none;border-color:var(--indigo);}

  .goal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
  .remove-goal{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;}
  .remove-goal:hover{color:var(--danger);}
  .edit-toggle-btn{font-size:12px;color:var(--cyan);background:none;border:none;cursor:pointer;}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty .mark{margin:0 auto 14px;}
  .empty p{font-size:14px;margin:4px 0;}

  .save-banner{
    display:none;align-items:center;gap:8px;background:rgba(248,113,113,0.1);
    border:1px solid rgba(248,113,113,0.35);color:#F87171;font-size:12.5px;
    padding:10px 12px;border-radius:10px;margin-bottom:16px;
  }
  .save-banner.show{display:flex;}

  @media (max-width:420px){
    .wrap{padding:20px 14px 40px;}
    .subtask-text{white-space:normal;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark"></div>
      <h1>Objetivos</h1>
    </div>
    <div class="header-right">
      <div class="count" id="countLabel">—</div>
      <button class="icon-btn" id="impToggleBtn" title="Gestionar importancias">★</button>
    </div>
  </header>

  <div class="save-banner" id="saveBanner">
    <span>⚠️</span>
    <span style="flex:1;">No se pudo guardar. Puede que el almacenamiento del navegador esté lleno o desactivado (modo privado).</span>
  </div>

  <div class="imp-panel" id="impPanel">
    <div class="imp-panel-title">Tipos de importancia</div>
    <div id="impList"></div>
    <div class="imp-add">
      <input id="impNameInput" type="text" placeholder="Nuevo tipo (ej. Urgente)…" maxlength="24">
    </div>
    <div class="imp-add" style="margin-top:8px;">
      <div class="color-swatches" id="impColorSwatches"></div>
      <button id="impAddBtn">Añadir</button>
    </div>
  </div>

  <div class="add-box">
    <input id="newGoalInput" type="text" placeholder="Nuevo objetivo…" maxlength="140">
    <button id="addGoalBtn">Añadir</button>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-filter="todos">Todos</button>
    <button class="chip" data-filter="pendiente">Pendiente</button>
    <button class="chip" data-filter="en progreso">En progreso</button>
    <button class="chip" data-filter="completado">Completado</button>
  </div>

  <div class="order-hint" id="orderHint">Usa las flechas ↑↓ para reordenar objetivos y subtareas.</div>

  <div id="goalsList"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="mark"></div>
    <p><strong>Aún no hay objetivos</strong></p>
    <p>Añade el primero arriba para empezar.</p>
  </div>
</div>

<script>
const STORAGE_KEY = 'objetivos_app_data_v1';
const IMP_KEY = 'objetivos_importance_types_v1';

const PALETTE = ['#6366F1','#22D3EE','#34D399','#FBBF24','#FB7185','#A78BFA','#38BDF8','#94A3B8'];
const IMP_PALETTE = ['#F87171','#FBBF24','#34D399','#38BDF8','#A78BFA','#94A3B8'];

let goals = [];
let importanceTypes = [];
let currentFilter = 'todos';
let loaded = false;
let selectedImpColor = IMP_PALETTE[0];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function seedImportance(){
  return [
    {id: uid(), name:'Alta', color:'#F87171'},
    {id: uid(), name:'Media', color:'#FBBF24'},
    {id: uid(), name:'Baja', color:'#94A3B8'}
  ];
}

function loadAll(){
  try{
    const rawGoals = localStorage.getItem(STORAGE_KEY);
    goals = rawGoals ? JSON.parse(rawGoals) : [];
    goals.forEach((g,i)=>{
      if(typeof g.order !== 'number') g.order = i;
      if(!g.color) g.color = PALETTE[0];
      if(!('importanceId' in g)) g.importanceId = null;
      (g.subtasks||[]).forEach((s,j)=>{
        if(typeof s.order !== 'number') s.order = j;
        if(!('notes' in s)) s.notes = '';
        if(!('open' in s)) s.open = false;
      });
    });
  }catch(e){
    console.error('Error cargando objetivos', e);
    goals = [];
  }
  try{
    const rawImp = localStorage.getItem(IMP_KEY);
    importanceTypes = rawImp ? JSON.parse(rawImp) : seedImportance();
    if(!rawImp) saveImportance();
  }catch(e){
    importanceTypes = seedImportance();
  }
  loaded = true;
  renderImportancePanel();
  render();
}

let saveTimer = null;
function showSaveBanner(show){
  const el = document.getElementById('saveBanner');
  if(!el) return;
  el.classList.toggle('show', !!show);
}
function saveGoals(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
      showSaveBanner(false);
    }catch(e){
      console.error('Error guardando', e);
      showSaveBanner(true);
    }
  }, 200);
}
function saveImportance(){
  try{
    localStorage.setItem(IMP_KEY, JSON.stringify(importanceTypes));
  }catch(e){
    console.error('Error guardando importancias', e);
  }
}

/* ---------- Goals ---------- */
function addGoal(title){
  const maxOrder = goals.reduce((m,g)=>Math.max(m,g.order||0), -1);
  goals.unshift({
    id: uid(), title: title.trim(), status:'pendiente', notes:'',
    open:true, color: PALETTE[0], importanceId: null,
    order: maxOrder + 1, subtasks: [], editing:false
  });
  normalizeOrders();
  saveGoals(); render();
}
function removeGoal(id){
  goals = goals.filter(g=>g.id!==id);
  saveGoals(); render();
}
function toggleOpen(id){
  const g = goals.find(g=>g.id===id);
  if(g){ g.open = !g.open; if(!g.open) g.editing=false; }
  render();
}
function toggleEdit(id){
  const g = goals.find(g=>g.id===id);
  if(g) g.editing = !g.editing;
  render();
}
function saveEdit(id, title, color, importanceId){
  const g = goals.find(g=>g.id===id);
  if(!g) return;
  if(title.trim()) g.title = title.trim();
  g.color = color;
  g.importanceId = importanceId || null;
  g.editing = false;
  saveGoals(); render();
}
function setStatus(id, status){
  const g = goals.find(g=>g.id===id);
  if(g) g.status = status;
  saveGoals(); render();
}
function setNotes(id, val){
  const g = goals.find(g=>g.id===id);
  if(g) g.notes = val;
  saveGoals();
}
function normalizeOrders(){
  goals.sort((a,b)=>(a.order||0)-(b.order||0));
  goals.forEach((g,i)=>g.order=i);
}
function moveGoal(id, dir){
  normalizeOrders();
  const idx = goals.findIndex(g=>g.id===id);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=goals.length) return;
  const tmp = goals[idx].order;
  goals[idx].order = goals[swapIdx].order;
  goals[swapIdx].order = tmp;
  saveGoals(); render();
}

/* ---------- Subtasks ---------- */
function addSubtask(id, text){
  const g = goals.find(g=>g.id===id);
  if(!g || !text.trim()) return;
  const maxOrder = g.subtasks.reduce((m,s)=>Math.max(m,s.order||0), -1);
  g.subtasks.push({id:uid(), text:text.trim(), done:false, notes:'', open:false, order:maxOrder+1});
  saveGoals(); render();
}
function toggleSubtask(gid, sid){
  const g = goals.find(g=>g.id===gid);
  if(!g) return;
  const s = g.subtasks.find(s=>s.id===sid);
  if(s) s.done = !s.done;
  saveGoals(); render();
}
function removeSubtask(gid, sid){
  const g = goals.find(g=>g.id===gid);
  if(!g) return;
  g.subtasks = g.subtasks.filter(s=>s.id!==sid);
  saveGoals(); render();
}
function toggleSubtaskNote(gid, sid){
  const g = goals.find(g=>g.id===gid);
  if(!g) return;
  const s = g.subtasks.find(s=>s.id===sid);
  if(s) s.open = !s.open;
  render();
}
function setSubtaskNote(gid, sid, val){
  const g = goals.find(g=>g.id===gid);
  if(!g) return;
  const s = g.subtasks.find(s=>s.id===sid);
  if(s) s.notes = val;
  saveGoals();
}
function moveSubtask(gid, sid, dir){
  const g = goals.find(g=>g.id===gid);
  if(!g) return;
  g.subtasks.sort((a,b)=>(a.order||0)-(b.order||0));
  g.subtasks.forEach((s,i)=>s.order=i);
  const idx = g.subtasks.findIndex(s=>s.id===sid);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=g.subtasks.length) return;
  const tmp = g.subtasks[idx].order;
  g.subtasks[idx].order = g.subtasks[swapIdx].order;
  g.subtasks[swapIdx].order = tmp;
  saveGoals(); render();
}

/* ---------- Importance ---------- */
function addImportanceType(name, color){
  if(!name.trim()) return;
  importanceTypes.push({id:uid(), name:name.trim(), color});
  saveImportance(); renderImportancePanel(); render();
}
function removeImportanceType(id){
  importanceTypes = importanceTypes.filter(t=>t.id!==id);
  goals.forEach(g=>{ if(g.importanceId===id) g.importanceId=null; });
  saveImportance(); saveGoals(); renderImportancePanel(); render();
}
function getImportance(id){
  return importanceTypes.find(t=>t.id===id) || null;
}

/* ---------- Helpers ---------- */
function statusClass(status){ return status.replace(' ', '-'); }
function progressOf(g){
  if(!g.subtasks.length) return g.status === 'completado' ? 100 : 0;
  const done = g.subtasks.filter(s=>s.done).length;
  return Math.round((done / g.subtasks.length) * 100);
}
function ringSvg(pct, color){
  const r = 14, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return `<svg width="36" height="36">
    <circle class="ring-bg" cx="18" cy="18" r="${r}" fill="none" stroke-width="3"></circle>
    <circle class="ring-fg" cx="18" cy="18" r="${r}" fill="none" stroke-width="3" style="stroke:${color}"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"></circle>
  </svg>`;
}
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- Render: importance panel ---------- */
function renderImportancePanel(){
  const list = document.getElementById('impList');
  if(importanceTypes.length === 0){
    list.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:6px 0;">Sin tipos aún.</div>`;
  }else{
    list.innerHTML = importanceTypes.map(t => `
      <div class="imp-row" data-id="${t.id}">
        <div class="imp-dot" style="background:${t.color}"></div>
        <div class="imp-name">${escapeHtml(t.name)}</div>
        <button class="imp-del" data-action="imp-del">✕</button>
      </div>
    `).join('');
    list.querySelectorAll('[data-action="imp-del"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.closest('.imp-row').getAttribute('data-id');
        removeImportanceType(id);
      });
    });
  }

  const swatchWrap = document.getElementById('impColorSwatches');
  swatchWrap.innerHTML = IMP_PALETTE.map(c => `
    <div class="swatch ${c===selectedImpColor?'selected':''}" style="background:${c}" data-color="${c}"></div>
  `).join('');
  swatchWrap.querySelectorAll('.swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      selectedImpColor = sw.getAttribute('data-color');
      renderImportancePanel();
    });
  });
}

/* ---------- Render: goals ---------- */
function render(){
  const list = document.getElementById('goalsList');
  const empty = document.getElementById('emptyState');
  const countLabel = document.getElementById('countLabel');
  const orderHint = document.getElementById('orderHint');

  if(!loaded){ list.innerHTML=''; return; }

  normalizeOrders();
  const sortedGoals = [...goals].sort((a,b)=>(a.order||0)-(b.order||0));
  const filtered = currentFilter === 'todos' ? sortedGoals : sortedGoals.filter(g=>g.status===currentFilter);

  const doneCount = goals.filter(g=>g.status==='completado').length;
  countLabel.textContent = goals.length ? `${doneCount}/${goals.length} completados` : '';
  orderHint.style.display = (currentFilter === 'todos' && goals.length > 1) ? 'flex' : 'none';

  if(goals.length === 0){
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty"><p>No hay objetivos en este filtro.</p></div>`;
    return;
  }

  list.innerHTML = filtered.map((g, visIdx) => {
    const pct = progressOf(g);
    const subCount = g.subtasks.length;
    const subDone = g.subtasks.filter(s=>s.done).length;
    const imp = getImportance(g.importanceId);
    const canReorder = currentFilter === 'todos';
    const isFirst = visIdx === 0;
    const isLast = visIdx === filtered.length - 1;
    const sortedSubs = [...g.subtasks].sort((a,b)=>(a.order||0)-(b.order||0));

    const impOptions = importanceTypes.map(t =>
      `<option value="${t.id}" ${g.importanceId===t.id?'selected':''}>${escapeHtml(t.name)}</option>`
    ).join('');

    return `
    <div class="goal ${g.open ? 'open':''}" data-id="${g.id}" style="--goal-color:${g.color}">
      <div class="goal-head">
        ${canReorder ? `
        <div class="reorder-col">
          <button class="reorder-btn" data-action="move-up" ${isFirst?'disabled':''}>▲</button>
          <button class="reorder-btn" data-action="move-down" ${isLast?'disabled':''}>▼</button>
        </div>` : ''}
        <div data-action="toggle" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer;">
          <div class="ring">${ringSvg(pct, g.color)}</div>
          <div class="goal-title-wrap">
            <div class="goal-title ${g.status==='completado'?'done':''}">${escapeHtml(g.title)}</div>
            <div class="goal-meta">
              ${imp ? `<span class="imp-badge" style="background:${imp.color}22;color:${imp.color}">${escapeHtml(imp.name)}</span>` : ''}
              <span>${subCount ? `${subDone}/${subCount} subtareas` : 'Sin subtareas'}</span>
            </div>
          </div>
        </div>
        <select class="status-select ${statusClass(g.status)}" data-action="status">
          <option value="pendiente" ${g.status==='pendiente'?'selected':''}>Pendiente</option>
          <option value="en progreso" ${g.status==='en progreso'?'selected':''}>En progreso</option>
          <option value="completado" ${g.status==='completado'?'selected':''}>Completado</option>
        </select>
        <div class="chevron" data-action="toggle" style="cursor:pointer;">▶</div>
      </div>
      <div class="goal-body">
        ${g.editing ? `
        <div class="edit-form">
          <div class="edit-field">
            <label>Nombre</label>
            <input type="text" data-action="edit-title" value="${escapeHtml(g.title)}" maxlength="140">
          </div>
          <div class="edit-field">
            <label>Color</label>
            <div class="color-swatches" data-action="edit-color-wrap">
              ${PALETTE.map(c=>`<div class="swatch ${c===g.color?'selected':''}" style="background:${c}" data-color="${c}"></div>`).join('')}
            </div>
          </div>
          <div class="edit-field">
            <label>Importancia</label>
            <select data-action="edit-importance">
              <option value="">Sin definir</option>
              ${impOptions}
            </select>
          </div>
          <div class="edit-actions">
            <button class="btn-save" data-action="save-edit">Guardar</button>
            <button class="btn-cancel" data-action="cancel-edit">Cancelar</button>
          </div>
        </div>
        ` : ''}

        <div class="section-label">
          <span>Subtareas</span>
        </div>
        ${sortedSubs.map((s, sIdx) => `
          <div class="subtask" data-sid="${s.id}">
            ${canReorder !== undefined ? `
            <div class="sub-reorder">
              <button class="reorder-btn" data-action="sub-up" ${sIdx===0?'disabled':''}>▲</button>
              <button class="reorder-btn" data-action="sub-down" ${sIdx===sortedSubs.length-1?'disabled':''}>▼</button>
            </div>` : ''}
            <div class="subtask-check ${s.done?'checked':''}" data-action="sub-toggle">${s.done?'✓':''}</div>
            <div class="subtask-text ${s.done?'checked':''}">${escapeHtml(s.text)}</div>
            <button class="sub-note-toggle ${s.notes?'has-note':''}" data-action="sub-note-toggle" title="Notas">📝</button>
            <button class="del-btn" data-action="sub-remove">✕</button>
          </div>
          ${s.open ? `
          <div class="subtask-notes">
            <textarea placeholder="Nota para esta subtarea…" data-action="sub-notes" data-sid="${s.id}">${escapeHtml(s.notes)}</textarea>
          </div>` : ''}
        `).join('')}
        <div class="add-sub">
          <input type="text" placeholder="Nueva subtarea…" data-action="sub-input" maxlength="140">
          <button data-action="sub-add">Añadir</button>
        </div>

        <div class="section-label">Notas del objetivo</div>
        <textarea class="notes" placeholder="Escribe una nota para este objetivo…" data-action="notes">${escapeHtml(g.notes)}</textarea>

        <div class="goal-footer">
          <button class="edit-toggle-btn" data-action="toggle-edit">${g.editing ? 'Cerrar edición' : 'Editar objetivo'}</button>
          <button class="remove-goal" data-action="remove-goal">Eliminar objetivo</button>
        </div>
      </div>
    </div>
    `;
  }).join('');

  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('.goal').forEach(goalEl => {
    const gid = goalEl.getAttribute('data-id');

    goalEl.querySelectorAll('[data-action="toggle"]').forEach(el=>{
      el.addEventListener('click', ()=> toggleOpen(gid));
    });

    const moveUp = goalEl.querySelector('[data-action="move-up"]');
    if(moveUp) moveUp.addEventListener('click', (e)=>{ e.stopPropagation(); moveGoal(gid, -1); });
    const moveDown = goalEl.querySelector('[data-action="move-down"]');
    if(moveDown) moveDown.addEventListener('click', (e)=>{ e.stopPropagation(); moveGoal(gid, 1); });

    const statusSel = goalEl.querySelector('[data-action="status"]');
    statusSel.addEventListener('click', e=>e.stopPropagation());
    statusSel.addEventListener('change', e=> setStatus(gid, e.target.value));

    goalEl.querySelectorAll('[data-action="sub-toggle"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const sid = el.closest('.subtask').getAttribute('data-sid');
        toggleSubtask(gid, sid);
      });
    });
    goalEl.querySelectorAll('[data-action="sub-remove"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const sid = el.closest('.subtask').getAttribute('data-sid');
        removeSubtask(gid, sid);
      });
    });
    goalEl.querySelectorAll('[data-action="sub-note-toggle"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const sid = el.closest('.subtask').getAttribute('data-sid');
        toggleSubtaskNote(gid, sid);
      });
    });
    goalEl.querySelectorAll('[data-action="sub-notes"]').forEach(el=>{
      el.addEventListener('input', ()=>{
        const sid = el.getAttribute('data-sid');
        setSubtaskNote(gid, sid, el.value);
      });
    });
    goalEl.querySelectorAll('[data-action="sub-up"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const sid = el.closest('.subtask').getAttribute('data-sid');
        moveSubtask(gid, sid, -1);
      });
    });
    goalEl.querySelectorAll('[data-action="sub-down"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const sid = el.closest('.subtask').getAttribute('data-sid');
        moveSubtask(gid, sid, 1);
      });
    });

    const subInput = goalEl.querySelector('[data-action="sub-input"]');
    const subAddBtn = goalEl.querySelector('[data-action="sub-add"]');
    const doAdd = ()=>{ if(subInput.value.trim()) addSubtask(gid, subInput.value); };
    subAddBtn.addEventListener('click', doAdd);
    subInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });

    const notesEl = goalEl.querySelector('[data-action="notes"]');
    notesEl.addEventListener('input', e=> setNotes(gid, e.target.value));

    goalEl.querySelector('[data-action="remove-goal"]').addEventListener('click', ()=> removeGoal(gid));
    goalEl.querySelector('[data-action="toggle-edit"]').addEventListener('click', ()=> toggleEdit(gid));

    const editForm = goalEl.querySelector('.edit-form');
    if(editForm){
      let chosenColor = goals.find(g=>g.id===gid).color;
      editForm.querySelectorAll('.swatch').forEach(sw=>{
        sw.addEventListener('click', ()=>{
          chosenColor = sw.getAttribute('data-color');
          editForm.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
          sw.classList.add('selected');
        });
      });
      editForm.querySelector('[data-action="save-edit"]').addEventListener('click', ()=>{
        const title = editForm.querySelector('[data-action="edit-title"]').value;
        const importanceId = editForm.querySelector('[data-action="edit-importance"]').value;
        saveEdit(gid, title, chosenColor, importanceId);
      });
      editForm.querySelector('[data-action="cancel-edit"]').addEventListener('click', ()=> toggleEdit(gid));
    }
  });
}

/* ---------- Global UI wiring ---------- */
document.getElementById('addGoalBtn').addEventListener('click', ()=>{
  const input = document.getElementById('newGoalInput');
  if(input.value.trim()){ addGoal(input.value); input.value=''; }
});
document.getElementById('newGoalInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const input = e.target;
    if(input.value.trim()){ addGoal(input.value); input.value=''; }
  }
});

document.getElementById('filters').addEventListener('click', e=>{
  const btn = e.target.closest('.chip');
  if(!btn) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.getAttribute('data-filter');
  render();
});

document.getElementById('impToggleBtn').addEventListener('click', ()=>{
  const panel = document.getElementById('impPanel');
  const btn = document.getElementById('impToggleBtn');
  panel.classList.toggle('show');
  btn.classList.toggle('active');
});
document.getElementById('impAddBtn').addEventListener('click', ()=>{
  const input = document.getElementById('impNameInput');
  if(input.value.trim()){
    addImportanceType(input.value, selectedImpColor);
    input.value = '';
  }
});
document.getElementById('impNameInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    if(e.target.value.trim()){
      addImportanceType(e.target.value, selectedImpColor);
      e.target.value = '';
    }
  }
});

loadAll();
</script>
</body>
</html>
