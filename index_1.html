<title>Objetivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E14;
    --surface:#141922;
    --surface-2:#1B2230;
    --line:#262E3D;
    --indigo:#6366F1;
    --indigo-dim:#4F46E5;
    --cyan:#22D3EE;
    --text:#E7E9EE;
    --muted:#8B93A6;
    --danger:#F87171;
    --done:#34D399;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:64px;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 18px 40px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mark{
    width:30px;height:30px;
    border-radius:9px;
    background:conic-gradient(from 220deg, var(--indigo), var(--cyan), var(--indigo));
    position:relative;
    flex:none;
  }
  .mark::after{
    content:'';
    position:absolute;
    inset:5px;
    background:var(--bg);
    border-radius:6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.02em;
  }
  .count{
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  .add-box{
    display:flex;
    gap:8px;
    margin-bottom:22px;
  }
  .add-box input{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    padding:13px 14px;
    border-radius:12px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  .add-box input::placeholder{color:var(--muted);}
  .add-box input:focus{outline:none;border-color:var(--indigo);}
  .add-box button{
    background:var(--indigo-dim);
    border:none;
    color:white;
    padding:0 18px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .add-box button:active{transform:scale(0.97);}

  .filters{
    display:flex;
    gap:6px;
    margin-bottom:18px;
    overflow-x:auto;
  }
  .chip{
    font-size:12px;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--muted);
    background:transparent;
    cursor:pointer;
    white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .chip.active{
    background:var(--surface-2);
    color:var(--text);
    border-color:var(--indigo);
  }

  .goal{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .goal-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 14px;
    cursor:pointer;
  }
  .ring{
    flex:none;
    width:36px;height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .ring svg{transform:rotate(-90deg);}
  .ring-bg{stroke:var(--surface-2);}
  .ring-fg{stroke:var(--indigo);transition:stroke-dashoffset .3s ease;}
  .ring-label{
    position:absolute;
    font-size:9px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .goal-title-wrap{flex:1;min-width:0;}
  .goal-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:15.5px;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .goal-title.done{
    color:var(--muted);
    text-decoration:line-through;
  }
  .goal-meta{
    font-size:11.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .status-select{
    flex:none;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:11.5px;
    font-family:'Inter',sans-serif;
    padding:6px 8px;
    border-radius:9px;
    -webkit-appearance:none;
    appearance:none;
  }
  .status-select.pendiente{color:var(--muted);}
  .status-select.en-progreso{color:var(--cyan);border-color:rgba(34,211,238,0.3);}
  .status-select.completado{color:var(--done);border-color:rgba(52,211,153,0.3);}

  .chevron{
    flex:none;
    color:var(--muted);
    transition:transform .2s ease;
    font-size:12px;
  }
  .goal.open .chevron{transform:rotate(90deg);}

  .goal-body{
    display:none;
    padding:0 16px 16px;
    border-top:1px solid var(--line);
  }
  .goal.open .goal-body{display:block;}

  .section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    margin:14px 0 8px;
    font-weight:600;
  }

  .subtask{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .subtask:last-of-type{border-bottom:none;}
  .subtask-check{
    flex:none;
    width:19px;height:19px;
    border-radius:6px;
    border:1.5px solid var(--line);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:transparent;
  }
  .subtask-check.checked{
    background:var(--indigo-dim);
    border-color:var(--indigo-dim);
    color:white;
  }
  .subtask-text{
    flex:1;
    font-size:14px;
  }
  .subtask-text.checked{
    color:var(--muted);
    text-decoration:line-through;
  }
  .del-btn{
    flex:none;
    color:var(--muted);
    background:none;
    border:none;
    font-size:16px;
    cursor:pointer;
    padding:2px 4px;
  }
  .del-btn:hover{color:var(--danger);}

  .add-sub{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .add-sub input{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 11px;
    border-radius:9px;
    font-size:13.5px;
    font-family:'Inter',sans-serif;
  }
  .add-sub input:focus{outline:none;border-color:var(--indigo);}
  .add-sub button{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--cyan);
    padding:0 14px;
    border-radius:9px;
    font-size:13px;
    cursor:pointer;
  }

  textarea.notes{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:10px;
    padding:10px 12px;
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    resize:vertical;
    min-height:64px;
  }
  textarea.notes:focus{outline:none;border-color:var(--indigo);}

  .goal-footer{
    display:flex;
    justify-content:flex-end;
    margin-top:12px;
  }
  .remove-goal{
    font-size:12px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
  }
  .remove-goal:hover{color:var(--danger);}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .empty .mark{margin:0 auto 14px;}
  .empty p{font-size:14px;margin:4px 0;}

  .save-banner{
    display:none;
    align-items:center;
    gap:8px;
    background:rgba(248,113,113,0.1);
    border:1px solid rgba(248,113,113,0.35);
    color:#F87171;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:16px;
  }
  .save-banner.show{display:flex;}

  @media (max-width:420px){
    .wrap{padding:20px 14px 40px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark"></div>
      <h1>Objetivos</h1>
    </div>
    <div class="count" id="countLabel">—</div>
  </header>

  <div class="save-banner" id="saveBanner">
    <span>⚠️</span>
    <span style="flex:1;">No se pudo guardar. Puede que el almacenamiento del navegador esté lleno o desactivado (modo privado).</span>
  </div>

  <div class="add-box">
    <input id="newGoalInput" type="text" placeholder="Nuevo objetivo…" maxlength="140">
    <button id="addGoalBtn">Añadir</button>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-filter="todos">Todos</button>
    <button class="chip" data-filter="pendiente">Pendiente</button>
    <button class="chip" data-filter="en progreso">En progreso</button>
    <button class="chip" data-filter="completado">Completado</button>
  </div>

  <div id="goalsList"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="mark"></div>
    <p><strong>Aún no hay objetivos</strong></p>
    <p>Añade el primero arriba para empezar.</p>
  </div>
</div>

<script>
const STORAGE_KEY = 'objetivos_app_data_v1';
let goals = [];
let currentFilter = 'todos';
let loaded = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadGoals(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    goals = raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error('Error cargando datos guardados', e);
    goals = [];
  }
  loaded = true;
  render();
}

let saveTimer = null;

function showSaveBanner(show){
  const el = document.getElementById('saveBanner');
  if(!el) return;
  el.classList.toggle('show', !!show);
}

function saveGoals(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
      showSaveBanner(false);
    }catch(e){
      console.error('Error guardando', e);
      showSaveBanner(true);
    }
  }, 200);
}

async function retrySaveNow(){
  if(!pendingPayload) pendingPayload = JSON.stringify(goals);
  const ok = await trySave(pendingPayload, 0);
  if(ok) pendingPayload = null;
  showSaveBanner(!ok);
}

function addGoal(title){
  goals.unshift({
    id: uid(),
    title: title.trim(),
    status: 'pendiente',
    notes: '',
    open: true,
    subtasks: []
  });
  saveGoals();
  render();
}

function removeGoal(id){
  goals = goals.filter(g => g.id !== id);
  saveGoals();
  render();
}

function toggleOpen(id){
  const g = goals.find(g=>g.id===id);
  if(g) g.open = !g.open;
  render();
}

function setStatus(id, status){
  const g = goals.find(g=>g.id===id);
  if(g) g.status = status;
  saveGoals();
  render();
}

function setNotes(id, val){
  const g = goals.find(g=>g.id===id);
  if(g) g.notes = val;
  saveGoals();
}

function addSubtask(id, text){
  const g = goals.find(g=>g.id===id);
  if(!g || !text.trim()) return;
  g.subtasks.push({id: uid(), text: text.trim(), done:false});
  saveGoals();
  render();
}

function toggleSubtask(gid, sid){
  const g = goals.find(g=>g.id===gid);
  if(!g) return;
  const s = g.subtasks.find(s=>s.id===sid);
  if(s) s.done = !s.done;
  saveGoals();
  render();
}

function removeSubtask(gid, sid){
  const g = goals.find(g=>g.id===gid);
  if(!g) return;
  g.subtasks = g.subtasks.filter(s=>s.id!==sid);
  saveGoals();
  render();
}

function statusClass(status){
  return status.replace(' ', '-');
}

function progressOf(g){
  if(!g.subtasks.length) return g.status === 'completado' ? 100 : 0;
  const done = g.subtasks.filter(s=>s.done).length;
  return Math.round((done / g.subtasks.length) * 100);
}

function ringSvg(pct){
  const r = 14, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return `<svg width="36" height="36">
    <circle class="ring-bg" cx="18" cy="18" r="${r}" fill="none" stroke-width="3"></circle>
    <circle class="ring-fg" cx="18" cy="18" r="${r}" fill="none" stroke-width="3"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"></circle>
  </svg>`;
}

function render(){
  const list = document.getElementById('goalsList');
  const empty = document.getElementById('emptyState');
  const countLabel = document.getElementById('countLabel');

  if(!loaded){ list.innerHTML=''; return; }

  const filtered = currentFilter === 'todos' ? goals : goals.filter(g=>g.status===currentFilter);

  const doneCount = goals.filter(g=>g.status==='completado').length;
  countLabel.textContent = goals.length ? `${doneCount}/${goals.length} completados` : '';

  if(goals.length === 0){
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty"><p>No hay objetivos en este filtro.</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(g => {
    const pct = progressOf(g);
    const subCount = g.subtasks.length;
    const subDone = g.subtasks.filter(s=>s.done).length;
    return `
    <div class="goal ${g.open ? 'open':''}" data-id="${g.id}">
      <div class="goal-head" data-action="toggle">
        <div class="ring">${ringSvg(pct)}</div>
        <div class="goal-title-wrap">
          <div class="goal-title ${g.status==='completado'?'done':''}">${escapeHtml(g.title)}</div>
          <div class="goal-meta">${subCount ? `${subDone}/${subCount} subtareas` : 'Sin subtareas'}</div>
        </div>
        <select class="status-select ${statusClass(g.status)}" data-action="status">
          <option value="pendiente" ${g.status==='pendiente'?'selected':''}>Pendiente</option>
          <option value="en progreso" ${g.status==='en progreso'?'selected':''}>En progreso</option>
          <option value="completado" ${g.status==='completado'?'selected':''}>Completado</option>
        </select>
        <div class="chevron">▶</div>
      </div>
      <div class="goal-body">
        <div class="section-label">Subtareas</div>
        ${g.subtasks.map(s => `
          <div class="subtask" data-sid="${s.id}">
            <div class="subtask-check ${s.done?'checked':''}" data-action="sub-toggle">${s.done?'✓':''}</div>
            <div class="subtask-text ${s.done?'checked':''}">${escapeHtml(s.text)}</div>
            <button class="del-btn" data-action="sub-remove">✕</button>
          </div>
        `).join('')}
        <div class="add-sub">
          <input type="text" placeholder="Nueva subtarea…" data-action="sub-input" maxlength="140">
          <button data-action="sub-add">Añadir</button>
        </div>

        <div class="section-label">Notas</div>
        <textarea class="notes" placeholder="Escribe una nota para este objetivo…" data-action="notes">${escapeHtml(g.notes)}</textarea>

        <div class="goal-footer">
          <button class="remove-goal" data-action="remove-goal">Eliminar objetivo</button>
        </div>
      </div>
    </div>
    `;
  }).join('');

  attachHandlers();
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function attachHandlers(){
  document.querySelectorAll('.goal').forEach(goalEl => {
    const gid = goalEl.getAttribute('data-id');

    goalEl.querySelector('[data-action="toggle"]').addEventListener('click', (e)=>{
      if(e.target.closest('[data-action="status"]')) return;
      toggleOpen(gid);
    });

    const statusSel = goalEl.querySelector('[data-action="status"]');
    statusSel.addEventListener('click', e=>e.stopPropagation());
    statusSel.addEventListener('change', e=>{
      setStatus(gid, e.target.value);
    });

    goalEl.querySelectorAll('[data-action="sub-toggle"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const sid = el.closest('.subtask').getAttribute('data-sid');
        toggleSubtask(gid, sid);
      });
    });

    goalEl.querySelectorAll('[data-action="sub-remove"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const sid = el.closest('.subtask').getAttribute('data-sid');
        removeSubtask(gid, sid);
      });
    });

    const subInput = goalEl.querySelector('[data-action="sub-input"]');
    const subAddBtn = goalEl.querySelector('[data-action="sub-add"]');
    const doAdd = ()=>{
      if(subInput.value.trim()){
        addSubtask(gid, subInput.value);
      }
    };
    subAddBtn.addEventListener('click', doAdd);
    subInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });

    const notesEl = goalEl.querySelector('[data-action="notes"]');
    notesEl.addEventListener('input', e=>{
      setNotes(gid, e.target.value);
    });

    goalEl.querySelector('[data-action="remove-goal"]').addEventListener('click', ()=>{
      removeGoal(gid);
    });
  });
}

document.getElementById('addGoalBtn').addEventListener('click', ()=>{
  const input = document.getElementById('newGoalInput');
  if(input.value.trim()){
    addGoal(input.value);
    input.value = '';
  }
});
document.getElementById('newGoalInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){
    const input = e.target;
    if(input.value.trim()){
      addGoal(input.value);
      input.value = '';
    }
  }
});

document.getElementById('filters').addEventListener('click', e=>{
  const btn = e.target.closest('.chip');
  if(!btn) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.getAttribute('data-filter');
  render();
});

loadGoals();
</script>
</body>
</html>
